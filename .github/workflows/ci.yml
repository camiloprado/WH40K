name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wh40k
          POSTGRES_PASSWORD: wh40k
          POSTGRES_DB: wh40k
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U wh40k -d wh40k"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check app tests --select E9,F63,F7,F82
      - run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic downgrade 0012_game_result
          python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://wh40k:wh40k@127.0.0.1:15432/wh40k
      - run: python -m pytest -q
        env:
          TEST_DB_SERVER: postgresql://wh40k:wh40k@127.0.0.1:15432
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://wh40k:wh40k@127.0.0.1:15432/wh40k

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings 200
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/mvp.spec.ts e2e/battleshock.spec.ts
